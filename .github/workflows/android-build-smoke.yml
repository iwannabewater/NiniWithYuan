name: Android Build Smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-android-release:
    name: Build signed main-branch candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Restore stable Android signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
      - name: Build signed Android release candidate
        env:
          NINI_ANDROID_KEYSTORE: ${{ github.workspace }}/android/release.keystore
          NINI_ANDROID_KEY_ALIAS: androiddebugkey
          NINI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          NINI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: npm run build:android
      - name: Remove Android signing material
        if: always()
        run: rm -f android/release.keystore
      - name: Inspect Android release candidate
        env:
          NINI_ANDROID_EXPECTED_CERT_SHA256: 23fe694d4adfb093a752c6a90f23086c6744bc520c89656079d78414979457e7
        run: bash scripts/inspect-android.sh dist/NiniYuan.apk
      - name: Record APK checksum
        working-directory: dist
        run: |
          sha256sum NiniYuan.apk > NiniYuan.apk.sha256
          sha256sum --check NiniYuan.apk.sha256
      - name: Attest Android release candidate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/NiniYuan.apk
      - name: Upload Android release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NiniYuan-${{ github.sha }}
          path: |
            dist/NiniYuan.apk
            dist/NiniYuan.apk.sha256
            dist/NiniYuan.apk.badging.txt
            dist/NiniYuan.apk.signature.txt
            dist/NiniYuan.apk.contents.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-android-smoke:
    name: Build pull-request smoke candidate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Build Android pull-request smoke candidate
        run: npm run build:android
      - name: Inspect Android pull-request smoke candidate
        run: bash scripts/inspect-android.sh dist/NiniYuan.apk
      - name: Verify pull-request APK checksum
        working-directory: dist
        run: |
          sha256sum NiniYuan.apk > NiniYuan.apk.sha256
          sha256sum --check NiniYuan.apk.sha256
